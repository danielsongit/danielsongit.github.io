<title>Daniel Morales | Thrust Stand</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #f7f8f5; --ink: #171a1c; --muted: #667076; --line: #d8ded5; --green: #1d5f52; --steel: #44546a; }
body { min-height: 100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(90deg, rgba(216,222,213,0.45) 1px, transparent 1px), linear-gradient(rgba(216,222,213,0.42) 1px, transparent 1px), var(--bg); background-size: 44px 44px; color: var(--ink); line-height: 1.6; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; background: rgba(247,248,245,0.9); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
nav a { color: var(--ink); font-weight: 800; text-decoration: none; }
.nav-name span { color: var(--green); }
.nav-links { display: flex; gap: 1.25rem; list-style: none; }
.nav-links a { color: var(--muted); font-size: 0.82rem; font-weight: 700; }
.wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
.eyebrow { color: var(--green); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.75rem; }
.case-hero { min-height: 520px; display: grid; align-items: end; padding: 9.5rem 0 4rem; background: linear-gradient(180deg, rgba(17,17,17,0.16), rgba(17,17,17,0.64)), linear-gradient(135deg, #44546a, #1d5f52); border-bottom: 1px solid var(--line); }
.case-hero h1 { max-width: 900px; color: #fff; font-size: clamp(3rem, 8vw, 7rem); line-height: 0.9; text-transform: uppercase; text-shadow: 0 18px 45px rgba(0,0,0,0.45); margin-bottom: 1.1rem; }
.case-hero .eyebrow { color: #fff !important; text-shadow: 0 8px 22px rgba(0,0,0,0.45); }
.case-hero p:not(.eyebrow) { max-width: 640px; color: rgba(255,255,255,0.92); font-size: 1.1rem; font-weight: 700; }
.overview { display: grid; grid-template-columns: repeat(3, 1fr); margin: 1.25rem auto; border: 1px solid var(--line); background: rgba(255,254,248,0.94); }
.overview p { padding: 1rem; color: var(--steel); border-right: 1px solid var(--line); }
.overview p:last-child { border-right: 0; }
.overview span { display: block; color: var(--muted); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.25rem; }
.overview strong { color: var(--ink); }
.case-body { margin: 1.6rem auto 5rem; }
.story-panel { border: 1px solid var(--line); background: rgba(255,254,248,0.92); padding: clamp(1.25rem, 3vw, 2.3rem); }
.story-panel h2 { font-size: clamp(1.8rem, 3.5vw, 3.1rem); line-height: 0.95; margin-bottom: 1rem; }
.story-panel p { color: var(--steel); font-size: 1.05rem; max-width: 700px; }
@media (max-width: 820px) { nav { padding: 0 20px; } .nav-links { display: none; } .wrap { width: min(100% - 28px, 1120px); } .case-hero { min-height: 430px; padding: 7rem 0 2.5rem; } .overview { grid-template-columns: 1fr; } .overview p { border-right: 0; border-bottom: 1px solid var(--line); } .overview p:last-child { border-bottom: 0; } }
</style>
<link rel="stylesheet" href="../te-style.css">
</head>

      <h1>Thrust Stand</h1>
      <p>Ongoing project.</p>
    </div>
  </section>

  <section class="wrap overview" aria-label="Thrust Stand project overview">
