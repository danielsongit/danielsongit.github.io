<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Morales | Resume</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f7f8f5;
  --panel: #ffffff;
  --ink: #171a1c;
  --muted: #667076;
  --line: #d8ded5;
  --green: #1d5f52;
  --steel: #44546a;
  --shadow: 0 18px 45px rgba(24, 33, 38, 0.09);
}
body {
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(90deg, rgba(216,222,213,0.45) 1px, transparent 1px), linear-gradient(rgba(216,222,213,0.42) 1px, transparent 1px), var(--bg);
  background-size: 44px 44px;
  color: var(--ink);
  line-height: 1.6;
}
nav {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5vw;
  background: rgba(247, 248, 245, 0.9);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
nav a { color: var(--ink); font-weight: 800; text-decoration: none; }
.nav-name span { color: var(--green); }
.nav-links { display: flex; gap: 1.25rem; list-style: none; }
.nav-links a { color: var(--muted); font-size: 0.82rem; font-weight: 700; }
.nav-links a:hover { color: var(--ink); }
.wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 3.5rem 0 5rem; }
.eyebrow { color: var(--green); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.75rem; }
h1 { font-size: clamp(2.35rem, 4.5vw, 4.4rem); line-height: 1; margin-bottom: 1rem; }
.intro { color: var(--steel); max-width: 720px; margin-bottom: 1.5rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 2rem; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 0 1rem;
  border: 1px solid var(--ink);
  border-radius: 6px;
  background: var(--ink);
  color: #fff;
  font-size: 0.86rem;
  font-weight: 800;
  text-decoration: none;
}
.btn.secondary {
  background: transparent;
  color: var(--ink);
}
.viewer {
  min-height: 78vh;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,254,248,0.92);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.viewer object {
  width: 100%;
  height: 78vh;
  min-height: 640px;
  display: block;
}
.fallback {
  color: var(--steel);
  padding: 1.5rem;
}
.fallback a { color: var(--ink); font-weight: 800; }
@media (max-width: 820px) {
  nav { padding: 0 20px; }
  .nav-links { display: none; }
  .wrap { width: min(100% - 28px, 1120px); padding: 2.5rem 0 4rem; }
  .viewer,
  .viewer object {
    min-height: 70vh;
  }
}
</style>
<link rel="stylesheet" href="te-style.css">
<style>
body.resume-page .viewer object { position: relative; z-index: 1; background: #fff; }
</style>
</head>
<body class="resume-page">
<nav>
  <a href="index.html" class="nav-name">Daniel<span>Morales</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="resume.html" aria-current="page">Resume</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<main class="wrap">
  <p class="eyebrow">Resume</p>
  <h1>Daniel Morales</h1>
  <p class="intro">Mechanical engineering student focused on CAD modeling, robotics, programming, rapid prototyping, and engineering computation.</p>

  <div class="actions" aria-label="Resume actions">
    <a class="btn" href="PDFS/Resume.pdf" target="_blank" rel="noopener">Open PDF</a>
    <a class="btn secondary" href="PDFS/Resume.pdf" download>Download Resume</a>
    <a class="btn secondary" href="contact.html">Contact Me</a>
  </div>

  <section class="viewer" aria-label="Resume PDF preview">
    <object data="PDFS/Resume.pdf#view=FitH" type="application/pdf">
      <p class="fallback">The resume preview is not available in this browser. <a href="PDFS/Resume.pdf" target="_blank" rel="noopener">Open the PDF instead.</a></p>
    </object>
  </section>
</main>
</body>
</html>
